# Test/dev upstream services WITH credentials (the "real secrets" cb protects). Not the backend's own DB.
# MongoDB with auth runs natively (the mongo Docker image fails on Linux kernel >= 6.19, SERVER-121912):
#   see cp-test-project/README.md → "start-services".
name: cb-test-services
services:
  redis-auth:
    image: redis:7
    ports: ["6380:6379"]
    command: ["redis-server", "--requirepass", "${CB_TEST_REDIS_PASSWORD:?set CB_TEST_REDIS_PASSWORD in your shell}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CB_TEST_REDIS_PASSWORD:?set CB_TEST_REDIS_PASSWORD in your shell}", "ping"]
      interval: 3s
      retries: 20
