# cb API contract. Owned by cb-backend; consumers run `npm run sync:contract`.
openapi: 3.1.0
x-contract-version: 1.2.0
info:
  title: cb API
  version: 1.0.0
  description: |-
    REST API of cb-backend, consumed by cb-dashboard (session cookie) and cb-env (device bearer token).

    Every success response is `{ success: true, data, meta: { correlationId } }`; paginated lists add
    `meta.pagination`. Every error is `ErrorBody` (PRD §12.7). Stored secrets are write-only: credential
    fields appear only in request bodies and are never returned. The `/tunnel` WebSocket is specified in
    `tunnel-protocol.md`.
servers:
  - url: http://localhost:4200
    description: Local development
tags:
  - name: Health
    description: Liveness and dependency health.
  - name: Auth
    description: Dashboard signup, login, sessions and invites (FR-AUTH-001, FR-AUTH-005).
  - name: Devices
    description: CLI device-code login and device management (FR-AUTH-002).
  - name: Orgs
    description: Organizations, members, invites and stats.
  - name: Projects
    description: Projects inside an organization.
  - name: Environments
    description: Environments of a project, including the kill switch.
  - name: Resources
    description: Brokered resources and their credential profiles (write-only secrets).
  - name: Variables
    description: Environment variables and the developer preview.
  - name: Access
    description: Grants and project access (J4, J7).
  - name: Audit
    description: Audit trail (J8).
  - name: Agent
    description: Agent bootstrap snapshot and event stream (device token).
paths:
  /api/orgs/{orgId}/sessions:
    get:
      operationId: listSessions
      tags:
        - Orgs
      summary: Active dashboard sessions of the organization's members (admin)
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Session"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags:
        - Orgs
      summary: Sign a dashboard session out (own, or a member's as admin)
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked:
                            type: boolean
                            const: true
                        required:
                          - revoked
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/orgs/{orgId}/killswitches:
    get:
      operationId: listKillSwitches
      tags:
        - Orgs
      summary: Kill switches, active first (admin)
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/KillSwitch"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: activateKillSwitch
      tags:
        - Orgs
      summary: Stop access at org, environment, resource, user or device scope (admin, typed reason; J7)
      description: Affected tunnels close within seconds with protocol-native errors; new sessions are refused (KILLSWITCH_ACTIVE) until cleared.
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateKillSwitchBody"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KillSwitch"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/killswitches/{killSwitchId}:
    delete:
      operationId: clearKillSwitch
      tags:
        - Orgs
      summary: Clear a kill switch (admin); agents restore access automatically
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/killSwitchId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KillSwitch"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/agent/heartbeat:
    post:
      operationId: agentHeartbeat
      tags:
        - Agent
      summary: Agent heartbeat with version and open tunnels (about once a minute)
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                            const: true
                        required:
                          - ok
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/presets:
    get:
      operationId: listPresets
      tags:
        - Resources
      summary: Provider presets (templates for new resources, §10.8)
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Preset"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Service health
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Health"
                    required:
                      - data
  /api/auth/signup:
    post:
      operationId: signup
      tags:
        - Auth
      summary: Create an account and organization (J1)
      description: Sets the `cb_session` cookie (httpOnly, SameSite=Lax). FR-AUTH-001.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Me"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Log in to the dashboard
      description: Sets the `cb_session` cookie. Wrong email or password → 401 INVALID_CREDENTIALS.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Me"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Log out (revokes the web session and clears the cookie)
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          loggedOut:
                            type: boolean
                            const: true
                        required:
                          - loggedOut
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/me:
    get:
      operationId: getMe
      tags:
        - Auth
      summary: Current user and memberships
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Me"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/invites/{token}:
    get:
      operationId: previewInvite
      tags:
        - Auth
      summary: Preview an invite before accepting it
      security: []
      parameters:
        - $ref: "#/components/parameters/inviteToken"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InvitePreview"
                    required:
                      - data
        "410":
          $ref: "#/components/responses/Gone"
  /api/auth/accept-invite:
    post:
      operationId: acceptInvite
      tags:
        - Auth
      summary: Accept an invite (FR-AUTH-005)
      description: With a session cookie the current user joins the organization (the `x-cb-csrf` header is then required). Without one, name, email and password create the account and a session cookie is set.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: x-cb-csrf
          in: header
          required: false
          description: Required (`1`) when a session cookie is sent; otherwise 403 CSRF_REQUIRED.
          schema:
            type: string
            const: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcceptInviteResult"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
  /api/agent/bootstrap:
    get:
      operationId: getBootstrap
      tags:
        - Agent
      summary: Snapshot for one project environment (FR-AGT-003)
      description: Requires a CLI device token (403 FORBIDDEN for dashboard sessions).
      security:
        - deviceToken: []
      parameters:
        - name: projectId
          in: query
          required: true
          description: Project id or slug.
          schema:
            type: string
            minLength: 1
        - name: env
          in: query
          required: true
          description: Environment name.
          schema:
            type: string
            minLength: 1
        - name: orgId
          in: query
          required: false
          description: Disambiguates a slug across organizations.
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Bootstrap"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/agent/events:
    get:
      operationId: streamAgentEvents
      tags:
        - Agent
      summary: Server-sent events for one environment (FR-EVT-002)
      description: |-
        Requires a CLI device token. The stream is `text/event-stream`; each message is `event: <name>` + `data: <json>`.

        | event | data | meaning |
        |---|---|---|
        | `ready` | `{"environmentId":"…"}` | Sent once when the stream opens. |
        | `config.changed` | `{"environmentId":"…","version":3}` | The snapshot changed; re-fetch `/api/agent/bootstrap`. |
        | `access.revoked` | `{"scope":"grant\|device\|membership\|environment\|project","reason":"…"}` | Access is gone (re-checked against the database before sending). |
        | `heartbeat` | `{}` | Every 15 s. |
      security:
        - deviceToken: []
      parameters:
        - name: envId
          in: query
          required: true
          description: Environment id.
          schema:
            $ref: "#/components/schemas/ObjectId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Event stream (stays open).
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - |+
                    event: ready
                    data: {"environmentId":"665f1c2ab3e4d5f6a7b8c9d0"}

        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cli/device/start:
    post:
      operationId: startDeviceAuth
      tags:
        - Devices
      summary: Start the device-code login (FR-AUTH-002 step 1)
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDeviceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeviceStart"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/cli/token/refresh:
    post:
      operationId: refreshTokens
      tags:
        - Devices
      summary: Rotate CLI tokens (FR-AUTH-003)
      description: Exchanges a refresh token (or, once, a legacy cbd_ device token) for a new token pair. A refresh token that was already used signs the device out (REFRESH_TOKEN_REUSED) and closes its tunnels.
      security:
        - {}
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 10
                  writeOnly: true
              required:
                - refreshToken
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenPair"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/cli/device/token:
    post:
      operationId: pollDeviceToken
      tags:
        - Devices
      summary: Poll for the device token (FR-AUTH-002 step 3)
      description: 400 DEVICE_AUTH_PENDING until approved; 410 DEVICE_CODE_EXPIRED after expiry; 404 for unknown or consumed codes. The token is returned exactly once.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollDeviceBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeviceTokenResult"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/cli/device/approve:
    post:
      operationId: approveDeviceAuth
      tags:
        - Devices
      summary: Approve a device code from the dashboard (FR-AUTH-002 step 2)
      description: Dashboard session only (403 for device tokens).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveDeviceBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeviceApproval"
                    required:
                      - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/cli/whoami:
    get:
      operationId: whoami
      tags:
        - Devices
      summary: Identity of the caller
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WhoAmI"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/cli/logout:
    post:
      operationId: cliLogout
      tags:
        - Devices
      summary: Revoke the calling device's token
      description: Device token only (403 for dashboard sessions).
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          loggedOut:
                            type: boolean
                            const: true
                        required:
                          - loggedOut
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/me/devices:
    get:
      operationId: listMyDevices
      tags:
        - Devices
      summary: My active devices
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Device"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags:
        - Devices
      summary: Revoke a device (own, or a member's as admin)
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/deviceId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked:
                            type: boolean
                            const: true
                        required:
                          - revoked
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/orgs:
    get:
      operationId: listOrgs
      tags:
        - Orgs
      summary: My organizations
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Org"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/orgs/{orgId}:
    get:
      operationId: getOrg
      tags:
        - Orgs
      summary: One organization
      security:
        - sessionCookie: []
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
