        caCert:
          $ref: "#/components/schemas/CaCertificate"
      required:
        - kind
        - name
        - connectionUri
    CreatePostgresResource:
      type: object
      properties:
        kind:
          type: string
          const: postgres
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed.
        connectionUri:
          type: string
          minLength: 10
          writeOnly: true
          description: Real Postgres connection URI.
