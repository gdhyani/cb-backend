          postgres: "#/components/schemas/CreatePostgresResource"
          mysql: "#/components/schemas/CreateMysqlResource"
          mongodb: "#/components/schemas/CreateMongodbResource"
          redis: "#/components/schemas/CreateRedisResource"
          smtp: "#/components/schemas/CreateSmtpResource"
          http: "#/components/schemas/CreateHttpResource"
          oauth: "#/components/schemas/CreateOauthResource"
          aws: "#/components/schemas/CreateAwsResource"
          google-sa: "#/components/schemas/CreateGoogleSaResource"
          apns: "#/components/schemas/CreateApnsResource"
    UpdateResourceBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed.
        disabled:
          type: boolean
          description: true closes every live tunnel to this service (J7).
        test:
          type: boolean
          description: Test the merged credential/config before storing; 422 SERVICE_TEST_FAILED on failure (D9).
        connectionUri:
          type: string
          minLength: 8
          writeOnly: true
          description: Rotates the credential (database/SMTP kinds).
        caCert:
          description: Replaces the CA certificate; an empty string removes it.
          oneOf:
            - $ref: "#/components/schemas/CaCertificate"
            - type: string
              const: ""
        apiKey:
          type: string
          minLength: 1
          writeOnly: true
          description: Rotates the credential (http).
        clientSecret:
          type: string
          minLength: 1
          writeOnly: true
          description: Rotates the credential (oauth).
        accessKeyId:
          type: string
          minLength: 3
          writeOnly: true
          description: Rotates the credential with secretAccessKey (aws).
        secretAccessKey:
          type: string
          minLength: 8
          writeOnly: true
          description: Rotates the credential with accessKeyId (aws).
        serviceAccountJson:
          type: string
          description: Rotates the credential (google-sa).
          writeOnly: true
        privateKey:
          type: string
          description: Rotates the credential (apns).
          writeOnly: true
        keyId:
          type: string
          pattern: ^[A-Z0-9]{10}$
        teamId:
          type: string
          pattern: ^[A-Z0-9]{10}$
        region:
          type: string
          pattern: ^[a-z0-9-]+$
        endpoint:
          type: string
          format: uri
          description: https://, or http:// only for private addresses (10/8, 172.16/12, 192.168/16, 127/8, ::1, fc00::/7, localhost) (D11).
        tokenUrl:
          type: string
          format: uri
          pattern: ^https://
        upstreamUrl:
          type: string
          format: uri
          description: https://, or http:// only for private addresses (10/8, 172.16/12, 192.168/16, 127/8, ::1, fc00::/7, localhost) (D11).
        authScheme:
          $ref: "#/components/schemas/AuthScheme"
        authHeader:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
        fakePrefix:
          type: string
          maxLength: 20
        basePath:
          type: string
        redirectHosts:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9.-]+:[0-9]{1,5}$
            description: host:port, e.g. api.example.com:443 (case-insensitive; stored lowercased).
            examples:
              - api.example.com:443
          maxItems: 10
      description: All fields optional; fields that do not apply to the resource's kind are ignored.
    ProfileCredentialsBody:
      type: object
      properties:
        connectionUri:
          type: string
          minLength: 8
          writeOnly: true
          description: Database/SMTP kinds.
        apiKey:
          type: string
          minLength: 1
          writeOnly: true
          description: http.
        clientSecret:
          type: string
          minLength: 1
          writeOnly: true
          description: oauth.
        accessKeyId:
          type: string
          minLength: 3
          writeOnly: true
          description: aws (with secretAccessKey).
        secretAccessKey:
          type: string
          minLength: 8
          writeOnly: true
          description: aws (with accessKeyId).
        serviceAccountJson:
          type: string
          description: google-sa.
          writeOnly: true
        privateKey:
          type: string
          description: apns.
          writeOnly: true
      description: The write-only credential fields matching the resource's kind; one set per profile.
    CreateProfileBody:
      allOf:
        - $ref: "#/components/schemas/ProfileCredentialsBody"
