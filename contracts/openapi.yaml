        field:
          type: string
          description: One of the resource's brokeredFields.
        required:
          type: boolean
          default: false
      required:
        - type
        - key
        - resourceId
        - field
    UpdateVariableBody:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/VariableKey"
        value:
          type: string
          maxLength: 10000
          writeOnly: true
          description: "plain: new value; visible: new write-only value."
        format:
          $ref: "#/components/schemas/GeneratedFormat"
        resourceId:
          type: string
        field:
          type: string
        required:
          type: boolean
      description: Fields that do not apply to the variable's type are ignored.
    ExpiresAt:
      oneOf:
        - type: string
          format: date-time
          description: ISO 8601; must be in the future. null = permanent.
        - type: "null"
    ResourceProfiles:
      type: array
      items:
        $ref: "#/components/schemas/ResourceProfileAssignment"
      maxItems: 50
    CreateGrantBody:
      type: object
      properties:
        userId:
          type: string
        resourceProfiles:
          $ref: "#/components/schemas/ResourceProfiles"
        expiresAt:
          $ref: "#/components/schemas/ExpiresAt"
      required:
        - userId
    UpdateGrantBody:
      type: object
      properties:
        resourceProfiles:
          $ref: "#/components/schemas/ResourceProfiles"
        expiresAt:
          $ref: "#/components/schemas/ExpiresAt"
    SetProjectAccessBody:
      type: object
      properties:
        scope:
          type: string
          enum:
            - project
            - environments
          description: '"project" = every environment incl. later ones; "environments" = only those listed.'
        environmentIds:
          type: array
          items:
            $ref: "#/components/schemas/ObjectId"
          maxItems: 50
          description: Required (at least one) when scope is "environments".
        expiresAt:
          $ref: "#/components/schemas/ExpiresAt"
        resourceProfiles:
          $ref: "#/components/schemas/ResourceProfiles"
      required:
        - scope
