    HeartbeatBody:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        activeTunnels:
          type: integer
          minimum: 0
      required: [version, activeTunnels]
    CreateServiceBody:
      type: object
      description: >-
        D1 one-step setup. `resource` holds the Create*Resource fields for its kind without `name`; secret fields
        inside it are write-only. Fake values and fake prefixes are never accepted from clients beyond the presets.
      properties:
        key:
          type: string
          pattern: ^[A-Z_][A-Z0-9_]*$
          description: The main variable's key, chosen by the admin (D2).
        preset:
          type: string
          description: Preset id from GET /api/presets; its defaults are applied first.
        mainField:
          type: string
          description: Brokered field for the main variable; defaults to the kind's secret field (url, key, clientSecret, secretAccessKey, credentialsJson).
        extras:
          type: array
          maxItems: 10
          items:
            oneOf:
              - type: object
                properties:
                  key:
                    type: string
                    pattern: ^[A-Z_][A-Z0-9_]*$
                  field:
                    type: string
                required: [key, field]
              - type: object
                properties:
                  key:
                    type: string
                    pattern: ^[A-Z_][A-Z0-9_]*$
                  value:
                    type: string
                    maxLength: 10000
                required: [key, value]
          default: []
        test:
          type: boolean
          default: true
        resource:
          type: object
          writeOnly: true
          properties:
            kind:
              $ref: "#/components/schemas/ResourceKind"
          required: [kind]
          additionalProperties: true
      required: [key, resource]
    ServiceCreated:
      type: object
      properties:
        service:
          $ref: "#/components/schemas/Resource"
        variables:
          type: array
          items:
            $ref: "#/components/schemas/Variable"
        test:
          oneOf:
            - $ref: "#/components/schemas/ResourceTestResult"
            - type: "null"
      required: [service, variables, test]
    ResourceTestResult:
      type: object
      properties:
        ok:
          type: boolean
        profile:
          type: string
        latencyMs:
          type: integer
        message:
          type: string
          description: Outcome in plain words; never contains the credential.
      required: [ok, profile, latencyMs, message]
    Preset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [AI, Payments, Auth, Push, Storage, Email, Database]
        group:
          type: string
          enum: [ai, oauth]
          description: Providers listed inside one dashboard type (AI API key, sign-in) (D6).
        kind:
          type: string
          enum: [mongodb, redis, postgres, mysql, smtp, http, oauth, aws, google-sa, apns]
        description:
          type: string
        defaults:
          type: object
          additionalProperties: true
          description: Non-secret create fields for the kind.
        secretPlaceholder:
          type: string
        variables:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              field:
                type: string
            required: [key, field]
        plainVariables:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              hint:
                type: string
            required: [key, hint]
      required: [id, name, category, kind, description, defaults, secretPlaceholder, variables]
