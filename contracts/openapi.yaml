          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              count:
                type: integer
            required:
              - kind
              - count
        grants:
          type: object
          properties:
            permanent:
              type: integer
            temporary:
              type: integer
          required:
            - permanent
            - temporary
      required:
        - scope
        - days
        - connectionsByProject
        - resourcesByKind
        - grants
    Bootstrap:
      type: object
      properties:
        schema:
          type: integer
          const: 1
        version:
          type: integer
        orgId:
          $ref: "#/components/schemas/ObjectId"
        projectId:
          $ref: "#/components/schemas/ObjectId"
        projectSlug:
          type: string
        environment:
          type: string
        envId:
          $ref: "#/components/schemas/ObjectId"
        orgCaCert:
          type: string
          description: PEM of the org CA used for Layer 2 TLS termination.
        plain:
          type: object
          additionalProperties:
            type: string
          description: "Env values the app receives directly: plain, generated, fake (AWS, OAuth, HTTP keys, Google/APNs) and admin-marked visible values."
        listeners:
          type: array
          items:
            type: object
            properties:
              resourceId:
                $ref: "#/components/schemas/ObjectId"
              kind:
                type: string
              name:
                type: string
              env:
                type: object
                additionalProperties:
                  type: string
                description: Env values for this listener; `{port}` is replaced by the agent's local port.
            required:
              - resourceId
              - kind
              - name
              - env
        redirects:
          type: array
          items:
            type: object
            properties:
              host:
                type: string
              port:
                type: integer
              resourceId:
                $ref: "#/components/schemas/ObjectId"
            required:
              - host
              - port
              - resourceId
        visibleKeys:
          type: array
          items:
            type: string
          description: Keys in `plain` that carry real values marked visible.
      required:
        - schema
        - version
        - orgId
        - projectId
        - projectSlug
        - environment
        - envId
        - orgCaCert
        - plain
        - listeners
        - redirects
        - visibleKeys
      description: "FR-AGT-003 snapshot: fake, personal and plain values only (S1)."
    SignupBody:
