components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cb_session
      description: "Dashboard session (httpOnly, SameSite=Lax). Mutating requests must also send `x-cb-csrf: 1` (see the CsrfHeader parameter)."
    deviceToken:
      type: http
      scheme: bearer
      description: CLI device token (prefix `cbd_`) from the device-code flow. Used by `/api/cli/*` and `/api/agent/*`.
  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    killSwitchId:
      name: killSwitchId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    CsrfHeader:
      name: x-cb-csrf
      in: header
      required: true
      description: Must be `1` on every mutating request authenticated with the session cookie (otherwise 403 CSRF_REQUIRED). Ignored for device bearer tokens.
      schema:
        type: string
        const: "1"
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: Optional; generated when absent and echoed in the response header and meta.
      schema:
        type: string
    orgId:
      name: orgId
      in: path
      required: true
      description: Organization id
      schema:
        $ref: "#/components/schemas/ObjectId"
    userId:
      name: userId
      in: path
      required: true
      description: User id
      schema:
        $ref: "#/components/schemas/ObjectId"
    inviteId:
      name: inviteId
      in: path
      required: true
      description: Invite id
      schema:
        $ref: "#/components/schemas/ObjectId"
    projectId:
      name: projectId
      in: path
      required: true
      description: Project id
      schema:
        $ref: "#/components/schemas/ObjectId"
    envId:
      name: envId
      in: path
      required: true
      description: Environment id
      schema:
        $ref: "#/components/schemas/ObjectId"
    resourceId:
      name: resourceId
      in: path
      required: true
      description: Resource id
      schema:
        $ref: "#/components/schemas/ObjectId"
    variableId:
      name: variableId
      in: path
      required: true
      description: Variable id
      schema:
        $ref: "#/components/schemas/ObjectId"
    grantId:
      name: grantId
      in: path
      required: true
      description: Grant id
      schema:
        $ref: "#/components/schemas/ObjectId"
    deviceId:
      name: deviceId
      in: path
      required: true
      description: Device id
      schema:
        $ref: "#/components/schemas/ObjectId"
    idOrSlug:
      name: idOrSlug
      in: path
      required: true
      description: Project id (24 hex) or slug.
      schema:
        type: string
    profileName:
      name: name
      in: path
      required: true
      description: Credential profile name.
      schema:
        type: string
    inviteToken:
      name: token
      in: path
      required: true
      description: Invite token from the invite link.
      schema:
        type: string
  responses:
    BadRequest:
      description: VALIDATION_FAILED (or DEVICE_AUTH_PENDING on the device poll)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: The request is invalid.
              statusCode: 400
              details:
                - path: name
                  message: "Too small: expected string to have >=1 characters"
              correlationId: c0ffee12-0000-4000-8000-000000000000
    Unauthorized:
      description: UNAUTHORIZED or INVALID_CREDENTIALS
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication is required.
              statusCode: 401
              correlationId: c0ffee12-0000-4000-8000-000000000000
    Forbidden:
      description: FORBIDDEN, CSRF_REQUIRED, NO_ACCESS or ENVIRONMENT_KILLED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have access to this resource.
              statusCode: 403
              correlationId: c0ffee12-0000-4000-8000-000000000000
    NotFound:
      description: NOT_FOUND (malformed ids are also reported as not found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: The requested resource was not found.
              statusCode: 404
              correlationId: c0ffee12-0000-4000-8000-000000000000
    ServiceTestFailed:
      description: SERVICE_TEST_FAILED — the connection test failed; nothing was saved (message is scrubbed of secrets)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            error:
              code: SERVICE_TEST_FAILED
              message: connect ECONNREFUSED 127.0.0.1:6379
              statusCode: 422
              correlationId: c0ffee12-0000-4000-8000-000000000000
    Conflict:
      description: CONFLICT, EMAIL_TAKEN or LAST_OWNER
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            error:
              code: CONFLICT
              message: The resource already exists or conflicts with another.
              statusCode: 409
              correlationId: c0ffee12-0000-4000-8000-000000000000
    Gone:
      description: INVITE_INVALID or DEVICE_CODE_EXPIRED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            error:
              code: INVITE_INVALID
              message: This invite link is invalid, already used or expired.
              statusCode: 410
              correlationId: c0ffee12-0000-4000-8000-000000000000
  schemas:
    Session:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        user:
