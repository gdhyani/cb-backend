          writeOnly: true
        upstreamUrl:
          type: string
          format: uri
          pattern: ^https://
          description: Must be an https:// URL.
        redirectHosts:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9.-]+:[0-9]{1,5}$
            description: host:port, e.g. api.example.com:443 (case-insensitive; stored lowercased).
            examples:
              - api.example.com:443
          maxItems: 10
      required:
        - kind
        - name
        - serviceAccountJson
    CreateApnsResource:
      type: object
