    CreateHttpResource:
      type: object
      properties:
        kind:
          type: string
          const: http
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed.
        upstreamUrl:
          type: string
          format: uri
          pattern: ^https?://
          description: https://, or http:// only for private addresses (10/8, 172.16/12, 192.168/16, 127/8, ::1, fc00::/7, localhost) (D11).
        authScheme:
          $ref: "#/components/schemas/AuthScheme"
          default: bearer
        authHeader:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
          description: Required when authScheme is header (D12).
        provider:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
          description: UI hint (preset or dashboard type that made the service); never used by the gateway.
        apiKey:
          type: string
          minLength: 1
          writeOnly: true
          description: Real API key.
        fakePrefix:
          type: string
          maxLength: 20
          default: cb_
        basePath:
          type: string
          pattern: ^(/[^\s]*)?$
          default: ""
          description: Empty or starts with /.
        redirectHosts:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9.-]+:[0-9]{1,5}$
            description: host:port, e.g. api.example.com:443 (case-insensitive; stored lowercased).
            examples:
              - api.example.com:443
          maxItems: 10
          default: []
      required:
        - kind
        - name
        - upstreamUrl
        - apiKey
    CreateAwsResource:
      type: object
      properties:
        kind:
          type: string
          const: aws
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed.
        region:
          type: string
          pattern: ^[a-z0-9-]+$
          description: e.g. eu-west-1, or auto for R2.
        endpoint:
          type: string
          format: uri
          description: https://, or http:// only for private addresses (10/8, 172.16/12, 192.168/16, 127/8, ::1, fc00::/7, localhost) (D11).
        accessKeyId:
          type: string
          minLength: 3
          writeOnly: true
          description: Real access key ID.
        secretAccessKey:
          type: string
          minLength: 8
          writeOnly: true
          description: Real secret access key.
      required:
        - kind
        - name
        - region
        - endpoint
        - accessKeyId
        - secretAccessKey
    CreateGoogleSaResource:
      type: object
      properties:
