          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed.
        keyId:
          type: string
          pattern: ^[A-Z0-9]{10}$
          description: 10-character key ID from Apple.
        teamId:
          type: string
          pattern: ^[A-Z0-9]{10}$
          description: 10-character team ID from Apple.
        privateKey:
          type: string
          description: Real .p8 signing key (PEM).
          writeOnly: true
        upstreamUrl:
          type: string
          format: uri
          pattern: ^https://
          description: Must be an https:// URL.
        redirectHosts:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9.-]+:[0-9]{1,5}$
            description: host:port, e.g. api.example.com:443 (case-insensitive; stored lowercased).
            examples:
              - api.example.com:443
          maxItems: 10
      required:
        - kind
        - name
        - keyId
        - teamId
        - privateKey
    CreateOauthResource:
      type: object
      properties:
        kind:
          type: string
          const: oauth
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed.
        tokenUrl:
          type: string
          format: uri
          pattern: ^https://
          description: Must be an https:// URL.
        clientSecret:
          type: string
          minLength: 1
          writeOnly: true
          description: Real OAuth client secret.
        upstreamUrl:
          type: string
          format: uri
          description: https://, or http:// only for private addresses (D11).
        redirectHosts:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9.-]+:[0-9]{1,5}$
            description: host:port, e.g. api.example.com:443 (case-insensitive; stored lowercased).
            examples:
              - api.example.com:443
          maxItems: 10
      required:
        - kind
        - name
        - tokenUrl
        - clientSecret
    CreateResourceBody:
      oneOf:
        - $ref: "#/components/schemas/CreatePostgresResource"
        - $ref: "#/components/schemas/CreateMysqlResource"
        - $ref: "#/components/schemas/CreateMongodbResource"
        - $ref: "#/components/schemas/CreateRedisResource"
        - $ref: "#/components/schemas/CreateSmtpResource"
        - $ref: "#/components/schemas/CreateHttpResource"
        - $ref: "#/components/schemas/CreateOauthResource"
        - $ref: "#/components/schemas/CreateAwsResource"
        - $ref: "#/components/schemas/CreateGoogleSaResource"
        - $ref: "#/components/schemas/CreateApnsResource"
      discriminator:
        propertyName: kind
