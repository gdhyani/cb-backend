          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required: [id, scope, targetId, targetLabel, reason, createdBy, createdAt, clearedAt]
    ActivateKillSwitchBody:
      type: object
      properties:
        scope:
          type: string
          enum: [org, environment, resource, user, device]
        targetId:
          $ref: "#/components/schemas/ObjectId"
          description: Required unless scope is org.
